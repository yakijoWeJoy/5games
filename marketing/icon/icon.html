<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The 5games / דף ועיפרון icon. Rendered to PNG by marketing/icon/render.js.  ?round=1 = Instagram profile (circle crop) -->
<style>
  html, body { margin: 0; background: transparent; }
  svg { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="85.33" height="85.33" patternUnits="userSpaceOnUse" x="-2" y="-2">
      <path d="M 85.33 0 L 0 0 0 85.33" fill="none" stroke="rgba(70,120,190,.20)" stroke-width="4"/>
    </pattern>
    <clipPath id="shape"><rect id="r" x="0" y="0" width="1024" height="1024" rx="230"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="10" dy="16" stdDeviation="10" flood-color="#3b3a36" flood-opacity=".22"/></filter>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="1024" height="1024" fill="#fbf8ef"/>
    <rect width="1024" height="1024" fill="url(#grid)"/>
    <rect id="margin" x="936" y="0" width="10" height="1024" fill="#e58f8f" opacity=".8"/>

    <!-- a red O: the second player's ink -->
    <g id="marks" transform="translate(30 56) translate(772 790) scale(.8) translate(-772 -790)">
      <path d="M 772 690 c -62 -4 -104 46 -100 104 c 4 62 54 98 110 92 c 58 -6 94 -54 88 -110 c -6 -52 -48 -88 -102 -84" fill="none" stroke="#c5332b" stroke-width="34" stroke-linecap="round"/>
    </g>

    <!-- the big hand-drawn 5, in the blue pen -->
    <path id="five" d="M 660 214 C 590 222, 470 222, 384 232 C 378 320, 368 400, 356 470 C 420 424, 520 410, 596 462 C 676 518, 686 650, 628 736 C 562 830, 410 836, 300 760"
          fill="none" stroke="#2350b8" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- the pencil that just wrote it -->
    <g id="pencil" transform="translate(694 214) rotate(40) scale(.62) translate(0 -196)" filter="url(#soft)">
      <rect x="-40" y="-330" width="80" height="420" rx="10" fill="#f7c948" stroke="#3b3a36" stroke-width="14"/>
      <line x1="-13" y1="-320" x2="-13" y2="80" stroke="#e0a92a" stroke-width="10"/>
      <line x1="13" y1="-320" x2="13" y2="80" stroke="#e0a92a" stroke-width="10"/>
      <rect x="-40" y="-388" width="80" height="62" rx="16" fill="#f29c9c" stroke="#3b3a36" stroke-width="14"/>
      <rect x="-44" y="-342" width="88" height="30" fill="#b9b6ad" stroke="#3b3a36" stroke-width="12"/>
      <path d="M -40 88 L 0 196 L 40 88 Z" fill="#f3dcb0" stroke="#3b3a36" stroke-width="14" stroke-linejoin="round"/>
      <path d="M -15 156 L 0 196 L 15 156 Z" fill="#3b3a36"/>
    </g>
  </g>
</svg>
<script>
  // Instagram crops the profile picture to a circle: pull everything in a little, keep the corners plain
  if (new URLSearchParams(location.search).get('round')) {
    const s = document.querySelector('svg');
    document.getElementById('r').setAttribute('rx', '0');
    for (const id of ['five', 'pencil', 'marks']) {
      const g = document.getElementById(id);
      const wrap = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      wrap.setAttribute('transform', 'translate(512 512) scale(.8) translate(-512 -512)');
      g.replaceWith(wrap); wrap.append(g);
    }
    document.getElementById('margin').setAttribute('x', '936');
  }
</script>
</body>
</html>
